# Copy to ~/.config/agent-config/profiles.toml and edit for this machine.
# Profiles (home folders) that ~/agent-config/bin/sync wires up.
# A harness listed here uses exactly these folders; unlisted harnesses use their
# standard home plus their own env variable (CLAUDE_CONFIG_DIR, CODEX_HOME, ...).

[claude]
profiles = ["~/.claude", "~/.claude-work"]

[codex]
profiles = ["~/.codex", "~/.codex-work"]
